# RoPE: all_dilution at ctx 8192, RoPE in every attention layer (model.positional: rope); LR as the S2 NoPE / ladder cells.
model:
  vocab_size: 50304
  n_layers: 12
  d_model: 512
  n_heads: 8
  context_length: 8192
  bias: false
  mlp: swiglu
  positional: rope
  attention: dilution
  layer_attention:
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
data:
  synthetic: false
  vocab_size: 50304
  train_path: data/fineweb_edu_10bt_1b/train.bin
  val_path: data/fineweb_edu_10bt_1b/val.bin
  train_tokens: 1000000000
  val_tokens: 5000000
  seed: 1337
training:
  device: auto
  dtype: auto
  compile: true
  batch_size: 2
  sequence_length: 8192
  gradient_accumulation_steps: 1
  max_steps: 36622
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  fused_optimizer: true
  log_interval: 25
  eval_interval: 500
  eval_batches: 8
  checkpoint_interval: 1000
  seed: 1337
  output_dir: runs/rope_8192/all_dilution_rope
