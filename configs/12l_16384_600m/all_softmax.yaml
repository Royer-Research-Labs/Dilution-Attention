# REFERENCE: conventional all-attention softmax decoder.
# 64M params, ctx 16384, 600M tokens (16,384 tok/step x 36,622 steps).
# Data: a 1B-token gpt2/fineweb-edu corpus (headerless uint16 + manifest.json).
model:
  vocab_size: 50304
  n_layers: 12
  d_model: 512
  n_heads: 8
  context_length: 16384
  bias: false
  mlp: swiglu
  attention: softmax
data:
  synthetic: false
  vocab_size: 50304
  train_path: data/fineweb_edu_10bt_1b/train.bin
  val_path: data/fineweb_edu_10bt_1b/val.bin
  train_tokens: 1000000000
  val_tokens: 5000000
  seed: 1337
training:
  device: auto
  dtype: auto
  compile: true
  batch_size: 1
  sequence_length: 16384
  gradient_accumulation_steps: 1
  max_steps: 36622
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  fused_optimizer: true
  log_interval: 25
  eval_interval: 500
  eval_batches: 8
  checkpoint_interval: 1000
  seed: 1337
  output_dir: runs/12l_16384_600m/all_softmax
