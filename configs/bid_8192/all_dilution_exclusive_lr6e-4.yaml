# TEMPORAL-ATTENTION HISTORY (S18): share = p / (committed + eps), i.e. the Sankaran 2016 /
# Paulus 2018 exclusive denominator on row-normalised bids, against dilution's inclusive
# p / (committed + p + eps). Degenerate at init: committed[i,i] is exactly 0 in causal
# self-attention, so the diagonal wins each row by 1/eps and attention collapses to the
# identity. This screen asks whether training escapes that.
model:
  vocab_size: 50304
  n_layers: 12
  d_model: 512
  n_heads: 8
  context_length: 8192
  bias: false
  mlp: swiglu
  bid: softmax
  share_cumsum: exclusive
  attention: dilution
  layer_attention:
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
  - dilution
data:
  synthetic: false
  vocab_size: 50304
  train_path: data/fineweb_edu_10bt_1b/train.bin
  val_path: data/fineweb_edu_10bt_1b/val.bin
  train_tokens: 1000000000
  val_tokens: 5000000
  seed: 1337
training:
  device: auto
  dtype: auto
  compile: true
  batch_size: 2
  sequence_length: 8192
  gradient_accumulation_steps: 1
  max_steps: 36622
  learning_rate: 6e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  fused_optimizer: true
  log_interval: 25
  eval_interval: 500
  eval_batches: 8
  checkpoint_interval: 1000
  seed: 1337
  output_dir: runs/bid_8192/all_dilution_exclusive_lr6e-4
