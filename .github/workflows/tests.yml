name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    # GitHub-hosted runners have no GPU: the reference path, harness, model and sampling tests
    # run; the fused-kernel parity tests skip themselves without CUDA.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
